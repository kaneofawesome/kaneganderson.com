<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <div class="nav-group">
      <nav>
        {{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button"
              title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
    </div>
  </div>
</header>
